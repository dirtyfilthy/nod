[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nod"
version = "0.1.0"
description = "A thin, swappable agent core. Rent the brain, build the scaffold."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "alhazred" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
nod = "nod.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
