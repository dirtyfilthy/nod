# Defaults for every experiment. Override per experiment with keyword args to
# lab.config(...). Secrets come from the environment (source env.sh).

model = "deepseek/deepseek-v4.1-flash-1017"

# This OpenRouter account can't use DeepSeek's first-party endpoint, so pin the
# same deployment the bench and the live config use.
provider_routing = { order = ["deepinfra/fp8"], allow_fallbacks = false }

max_turns = 20
